[project]
name = "fly-arena"
version = "0.1.0"
description = "Connectome-constrained digital fly design and embodied competition"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "numpy>=2,<3",
  "scipy>=1.15,<2",
  "pyarrow>=20,<24",
  "pydantic>=2.10,<3",
  "httpx>=0.28,<1",
  "flygym==2.1.0",
  "numba>=0.65.1",
  "pyjwt[crypto]>=2.10,<3",
]

[dependency-groups]
dev = ["pytest>=9,<10"]

[project.scripts]
arena = "flyarena.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flyarena"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

markers = ["integration: requires a prepared full connectome or retained scientific experiment data"]
